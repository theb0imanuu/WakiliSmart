<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  aria-label="Column Growth Logo"
  role="img">

  <!-- Outer dark blue disc -->
  <circle cx="256" cy="256" r="236" fill="#0E2F4F"/>

  <!-- Silver ring -->
  <circle
    cx="256"
    cy="256"
    r="210"
    fill="none"
    stroke="#D3D6DB"
    stroke-width="20"/>

  <!-- Column top slab -->
  <rect
    x="162"
    y="122"
    width="188"
    height="20"
    rx="10"
    fill="#D3D6DB"/>

  <!-- Column capital -->
  <rect
    x="188"
    y="148"
    width="136"
    height="18"
    rx="9"
    fill="#D3D6DB"/>

  <!-- Column shaft -->
  <rect
    x="200"
    y="170"
    width="112"
    height="270"
    rx="12"
    fill="#D3D6DB"/>

  <!-- Column flutes (negative space) -->
  <rect x="220" y="182" width="12" height="250" fill="#0E2F4F"/>
  <rect x="250" y="182" width="12" height="250" fill="#0E2F4F"/>
  <rect x="280" y="182" width="12" height="250" fill="#0E2F4F"/>

</svg>
